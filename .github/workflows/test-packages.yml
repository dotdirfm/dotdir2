name: Test packages

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - .github/workflows/test-packages.yml
      - .github/workflows/build-packages.yml
      - packaging/**
      - xtask/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/build-packages.yml

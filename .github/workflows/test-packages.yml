name: Test packages

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-packages.yml
      - packaging/**
      - xtask/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml

permissions:
  contents: read

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build application
        run: cargo dist

      - name: Build and verify disk image
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/pip" install dmgbuild==2.0.0
          mkdir -p dist/installers
          dmg=dist/installers/DotDir-macOS-arm64.dmg
          "$RUNNER_TEMP/dmg-tools/bin/dmgbuild" -s packaging/macos/dmg.py \
            -D 'app=dist/macos/DotDir Native.app' \
            -D background=packaging/macos/background.png 'DotDir Native' "$dmg"

          hdiutil verify "$dmg"
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir"' EXIT
          test "$(readlink "$mount_dir/Applications")" = /Applications
          test -s "$mount_dir/.background.tiff"
          codesign --verify --deep --strict "$mount_dir/DotDir Native.app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DotDir-macOS-arm64
          path: dist/installers/DotDir-macOS-arm64.dmg
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build application
        run: cargo dist

      - name: Build installer
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP innosetup.exe
          $compilerDir = Join-Path $env:RUNNER_TEMP inno-setup
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $download
          if ((Get-FileHash $download).Hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') {
            throw 'Inno Setup download checksum mismatch'
          }
          $tool = Start-Process $download -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$compilerDir`"" -Wait -PassThru
          if ($tool.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($tool.ExitCode)" }

          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq dotdir).version
          & "$compilerDir\ISCC.exe" "/DAppVersion=$version" packaging\windows\dotdir.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }

      - name: Verify install and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP dotdir-test-install
          $setup = Start-Process dist/installers/DotDir-Windows-x64-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "DotDir installation failed with exit code $($setup.ExitCode)" }
          $expected = (Get-FileHash dist/windows/dotdir.exe).Hash
          if ((Get-FileHash "$installDir\dotdir.exe").Hash -ne $expected) { throw 'Installed executable checksum mismatch' }
          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$installDir\dotdir.exe")) { throw 'DotDir uninstall failed' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DotDir-Windows-x64
          path: dist/installers/DotDir-Windows-x64-Setup.exe
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config \
            libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev libvulkan1 desktop-file-utils

      - name: Build application
        run: cargo dist

      - name: Build and verify AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          tool="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            --output "$tool"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $tool" | sha256sum --check
          chmod +x "$tool"
          desktop-file-validate packaging/linux/dev.dotdir.native.desktop

          export LDAI_OUTPUT="$PWD/dist/installers/DotDir-Linux-x86_64.AppImage"
          mkdir -p dist/installers
          "$tool" --appdir "$RUNNER_TEMP/DotDir.AppDir" \
            --executable dist/linux/dotdir \
            --desktop-file packaging/linux/dev.dotdir.native.desktop \
            --icon-file packaging/linux/dev.dotdir.native.png \
            --output appimage

          cd "$RUNNER_TEMP"
          "$LDAI_OUTPUT" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/dotdir
          test -x squashfs-root/AppRun
          test -f squashfs-root/dev.dotdir.native.desktop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DotDir-Linux-x64
          path: dist/installers/DotDir-Linux-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

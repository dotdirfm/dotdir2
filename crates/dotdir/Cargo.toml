[package]
name = "dotdir"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
dotdir-core = { path = "../dotdir-core" }
dotdir-extension-host = { path = "../dotdir-extension-host" }
gpui-kit = { version = "=0.11.0", features = ["tree-sitter-rust", "tree-sitter", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-toml", "tree-sitter-css", "tree-sitter-bash", "tree-sitter-markdown"] }
dirs = "6"
chrono = "0.4"
trash = "5"
portable-pty = "0.9"
alacritty_terminal = "0.25"
open = "5"
globset = "0.4"
async-channel = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSError"] }

objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CMTime"] }

[dev-dependencies]
tempfile = "3"


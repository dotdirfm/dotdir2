[package]
name = "dotdir"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
dotdir-core = { path = "../dotdir-core" }
dotdir-extension-host = { path = "../dotdir-extension-host" }
gpui-kit = { version = "=0.11.0", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
ts-parser-perl = "2.1.2"
dirs = "6"
sys-locale = "0.3"
chrono = "0.4"
trash = "5"
portable-pty = "0.9"
alacritty_terminal = "0.25"
open = "5"
globset = "0.4"
regex = "1"
async-channel = "2"
lsp-types = "0.97"
url = "2"
percent-encoding = "2"
tempfile = "3"
same-file = "1"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSError"] }

objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CMTime"] }

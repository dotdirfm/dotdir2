[package]
name = "dotdir"
version.workspace = true
edition.workspace = true

[features]
default = ["sevenz-extension", "tar-extension", "zip-extension", "ftp-extension", "webdav-extension", "smb-extension", "s3-extension"]
sevenz-extension = ["dep:dotdir-sevenz"]
tar-extension = ["dep:dotdir-tar"]
zip-extension = ["dep:dotdir-zip"]
ftp-extension = ["dotdir-remote/ftp"]
webdav-extension = ["dotdir-remote/webdav"]
smb-extension = ["dotdir-remote/smb"]
s3-extension = ["dotdir-remote/s3"]

[dependencies]
anyhow.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
dotdir-core = { path = "../dotdir-core" }
dotdir-archive-api = { path = "../dotdir-archive-api" }
dotdir-extension-host = { path = "../dotdir-extension-host" }
dotdir-remote = { path = "../../extensions/remote" }
dotdir-sevenz = { path = "../../extensions/sevenz", optional = true }
dotdir-tar = { path = "../../extensions/tar", optional = true }
dotdir-zip = { path = "../../extensions/zip", optional = true }
gpui-kit = { version = "=0.11.0", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
ts-parser-perl = "2.1.2"
dirs = "6"
sys-locale = "0.3"
chrono = "0.4"
trash = "5"
portable-pty = "0.9"
alacritty_terminal = "0.25"
open = "5"
globset = "0.4"
regex = "1"
async-channel = "2"
lsp-types = "0.97"
url = "2"
percent-encoding = "2"
tempfile = "3"
same-file = "1"
ring = "0.17"
roxmltree = "0.21"
zip.workspace = true
jsonc-parser = { version = "0.34", features = ["serde"] }
plist = "1.10"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.10"
markdown = "1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
resvg = { version = "0.46", default-features = false, features = ["text"] }
smallvec = "1"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sevenz-rust2 = { version = "0.27", default-features = false, features = ["compress"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSURL", "NSError"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "dispatch2", "AVAsset", "AVAssetResourceLoader", "AVPlayerItem"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }
dispatch2 = "0.3"

objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CMTime"] }

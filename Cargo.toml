[workspace]
members = [
    "crates/dotdir",
    "crates/dotdir-archive-api",
    "crates/dotdir-core",
    "crates/dotdir-extension-host",
    "extensions/remote",
    "extensions/sevenz",
    "extensions/tar",
    "extensions/zip",
    "xtask",
]
default-members = ["crates/dotdir"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[patch.crates-io]
# Bound accessibility text generation until GPUI Kit releases the large-document fix.
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "c77088781e9197e23392f66c0f1a9674868ec5b6" }

[profile.dev]
debug = 1

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0

